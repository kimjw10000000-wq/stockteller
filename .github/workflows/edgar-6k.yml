# SEC 8-K / 6-K Exhibit 99.1 press release → Groq → wire_news.
# Hourly schedule paused — turn back on with `on.schedule` when ready to experiment.
#
# Secret: CRON_SECRET (same as Vercel)
# Optional: CRAWL_6K_WEBHOOK_URL (default https://whyup.net/api/cron/edgar-6k)

name: edgar-6k-crawl

on:
  workflow_dispatch: {}

concurrency:
  group: edgar-6k-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Crawl via deployed webhook
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRAWL_6K_WEBHOOK_URL: ${{ secrets.CRAWL_6K_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET not set"
            exit 1
          fi
          URL="${CRAWL_6K_WEBHOOK_URL:-https://whyup.net/api/cron/edgar-6k}"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/crawl-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 290 \
            "$URL")
          echo "HTTP $code"
          cat /tmp/crawl-body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "6-K crawl failed with HTTP $code"
            exit 1
          fi
