# GlobeNewswire RSS → Groq GPT → Supabase (`wire_news`).
#
# Hobby Vercel Cron is daily-only and already has two jobs, so this workflow
# polls every 15 minutes via the deployed webhook.
#
# Secrets: CRON_SECRET (same as Vercel). Optional CRAWL_GNW_WEBHOOK_URL.

name: gnw-rss

# schedule paused so overnight failed-run emails stop. Re-enable */15 when CRON_SECRET is set.
on:
  workflow_dispatch: {}

concurrency:
  group: gnw-rss
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Crawl via deployed webhook
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRAWL_GNW_WEBHOOK_URL: ${{ secrets.CRAWL_GNW_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET not set"
            exit 1
          fi
          URL="${CRAWL_GNW_WEBHOOK_URL:-https://whyup.net/api/cron/gnw-rss}"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/gnw-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 290 \
            "$URL")
          echo "HTTP $code"
          cat /tmp/gnw-body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "Remote gnw crawl failed with HTTP $code"
            exit 1
          fi
