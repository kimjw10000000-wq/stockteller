name: verify-operator-keys

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/verify-operator-keys.yml"
      - "web/scripts/verify-operator-keys.ts"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Verify keys
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLYGON_API_KEY_ADVANCED: ${{ secrets.POLYGON_API_KEY_ADVANCED }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_API_KEY_STARTER: ${{ secrets.POLYGON_API_KEY_STARTER }}
          TOSSINVEST_CLIENT_ID: ${{ secrets.TOSSINVEST_CLIENT_ID }}
          TOSSINVEST_CLIENT_SECRET: ${{ secrets.TOSSINVEST_CLIENT_SECRET }}
        run: npx tsx scripts/verify-operator-keys.ts
